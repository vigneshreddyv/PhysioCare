name: CI

on:
  push:
    branches: [main, develop, "codex/**", "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock pip-audit==2.10.1
      - name: Run tests
        run: python -m pytest -q
      - name: Compile application and tests
        run: python -m compileall -q app tests
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements.lock

  frontend:
    name: Frontend tests, build, and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run contract tests
        run: npm test
      - name: Run lint
        run: npm run lint
      - name: Build production bundle
        run: npm run build
      - name: Enforce production bundle budget
        run: npm run check:bundle
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
